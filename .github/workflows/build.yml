name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: No Gradle project or ZIP file found."
              exit 1
            fi
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
            PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          else
            PROJECT_DIR="."
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app folder or Gradle settings not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
